# waze-on-cluster: patchd restarts carplay with SIGKILL to load a changed
# binary or the patch in memory. As a success exit it does not fail
# carplay.service, so its OnFailure=mediaddpserver_kill.service does not run.
[Service]
SuccessExitStatus=SIGKILL
# The patch in memory (PATCH.md "In memory"): boot recovery writes this file
# in /run only for a start it arms, with LD_PRELOAD (the unit's own
# libschedconfig, then libwocpatch.so) and the plan's paths. Without it
# ("-"), carplay starts as it ships.
EnvironmentFile=-/run/woc-preload/carplay.env
