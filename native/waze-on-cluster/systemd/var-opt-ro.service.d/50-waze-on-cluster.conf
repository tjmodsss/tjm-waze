# waze-on-cluster: at each head-unit shutdown, before /var/opt goes
# read-only, the boot recovery records whether carplay and aapd were
# running, failed or stopped (shutdown_mark.sh), and the journal keeper
# writes its newest lines there from RAM (journal_keep.js keep). A failure
# ("-") never holds up the shutdown.
[Service]
ExecStartPre=-/bin/sh /var/opt/waze-on-cluster/current/shutdown_mark.sh
ExecStartPre=-/usr/bin/node /var/opt/waze-on-cluster/current/journal_keep.js keep shutdown
